<!doctype html>
<html lang="bn" data-theme="upkotha">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UPKOTHA (উপকথা) — সহজ ভাষায়, বুদ্ধিমানভাবে, নিরাপদে ডিজিটাল ফাইন্যান্স" />
    <title>UPKOTHA (উপকথা) — AI Financial Assistant</title>
    <!-- Google Fonts: Inter & Noto Sans Bengali -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify"], iframe[srcdoc*="Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <script>
      (function() {
        const killBadge = () => {
          document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify"]').forEach(f => f.remove());
        };
        const obs = new MutationObserver(killBadge);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', killBadge);
      })();
    </script>
  </head>
  <body class="bg-base-200 text-neutral min-h-screen antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
